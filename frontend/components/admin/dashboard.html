<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Trio Saung Nusantara</title>

    <link rel="stylesheet" href="../../css/variable.css">
    <link rel="stylesheet" href="../../css/Admin/admin.css">
</head>
<body>
    <!-- header logo & nama resto & logout -->
    <div class="header">
        <button class="burger-menu" id="burgerToggle" aria-label="Toggle Sidebar">
            <span class="burger"></span>
        </button>

        <div class="logo">
            <img src="../../assets/images/logo/bulat.png" alt="logo Trio Saung Nusantara" class="logo">
        </div>

        <div class="title">
            <h1>Trio Saung Nusantara</h1>
        </div>

        <button class="btn-logout">
            <span class="icon-logout"></span>
            <span>Logout</span>
        </button>
    </div>

    <!-- lapis 2 -->
    <div class="welcome">
        <!-- bagian kiri -->
        <section class="acc-card">
            <span class="profile" id="profileAvatar"></span>
            <h3 id="profileName">Admin Saung</h3>
            <p id="profileEmail">admin@saung.com</p>
        </section>

        <!-- bagian kanan -->
        <section class="welcome-content">
            <!-- sambutan -->
            <h1 class="salam" id="welcomeTitle">Selamat Datang, Admin!</h1>
            <p class="sub-salam">Ringkasan aktivitas operasional harian.</p>

            <!-- 3 kartu -->
            <section class="card-list">
                <div class="card-content">
                    <div class="icon-card">
                        <span class="pendapatan"></span>
                    </div>
                    <div class="label">
                        <h3 class="subtitle">Total Pendapatan</h3>
                        <h3 class="nilai" id="totalPendapatan">Rp 0</h3>
                    </div>
                </div>

                <div class="card-content">
                    <div class="icon-card">
                        <span class="pemesanan"></span>
                    </div>
                    <div class="label">
                        <h3 class="subtitle">Total Pemesanan</h3>
                        <h3 class="nilai" id="totalPemesanan">0</h3>
                    </div>
                </div>

                <div class="card-content">
                    <div class="icon-card">
                        <span class="menu"></span>
                    </div>
                    <div class="label">
                        <h3 class="subtitle">Menu Tersedia</h3>
                        <h3 class="nilai" id="menuTersedia">0/0</h3>
                    </div>
                </div>
            </section>
        </section>
    </div>

    <!-- lapis 3 -->
    <div class="lapis3">
        <div class="tab-bar">
            <button class="tab-active">
                <a href="dashboard.html">
                    <span class="dashboard"></span>
                    <span>Dashboard</span>
                </a>
            </button>

            <button class="tab">
                <a href="menu.html">
                    <span class="icon-menu"></span>
                    <span>Menu</span>
                </a>
            </button>

            <button class="tab">
                <a href="akun.html">
                    <span class="akun"></span>
                    <span>Akun</span>
                </a>
            </button>

            <button class="tab">
                <a href="laporan.html">
                    <span class="laporan"></span>
                    <span>Laporan Transaksi</span>
                </a>
            </button>
        </div>

        <div class="main-content">
            <!-- Grafik Pesanan per Jam -->
            <section class="content1">
                <div class="content1-header">
                    <h3>Pesanan per Jam (Hari Ini)</h3>
                    <div class="peak-badge" id="peakHourBadge">
                        <div class="peak-text">
                            <span class="peak-label">Jam Tersibuk</span>
                            <span class="peak-time" id="peakHourTime">-</span>
                        </div>
                        <span class="icon-clock"></span>
                    </div>
                </div>

                <div class="hourly-chart" id="hourlyChart">
                    <!-- Dirender otomatis oleh dashboard.js -->
                </div>
            </section>

            <!-- Baris bawah: Top 5 Menu & Aktivitas Transaksi -->
            <section class="content2">
                <div class="menu-terlaris">
                    <h3>Top 5 Menu Terlaris</h3>
                    <ul class="top-menu-list" id="topMenuList">
                        <!-- Dirender otomatis oleh dashboard.js -->
                    </ul>
                </div>

                <div class="transaksi">
                    <div class="transaksi-header">
                        <h3>Aktivitas Transaksi</h3>
                        <a href="laporan.html" class="lihat-semua">Lihat Semua</a>
                    </div>
                    <ul class="transaksi-list" id="recentTransactionsList">
                        <!-- Dirender otomatis oleh dashboard.js -->
                    </ul>
                </div>
            </section>
        </div>
    </div>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/Admin/admin.js"></script>
    <script src="/frontend/js/Admin/dashboard.js"></script>
</body>
</html>

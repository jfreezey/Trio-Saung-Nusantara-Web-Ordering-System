<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Trio Saung Nusantara</title>

    <link rel="stylesheet" href="../../css/variable.css">
    <link rel="stylesheet" href="../../css/Admin/admin.css">
    <link rel="stylesheet" href="../../css/Admin/menu.css">
</head>
<body>
    <!-- header logo & nama resto & logout -->
    <div class="header">
        <button class="burger-menu" id="burgerToggle" aria-label="Toggle Sidebar">
            <span class="burger"></span>
        </button>
        
        <div class="logo">
            <img src="../../assets/images/logo/bulat.png" alt="logo Trio Saung Nusantara" class="logo">
        </div>

        <div class="title">
            <h1>Trio Saung Nusantara</h1>
        </div>
        
        <button class="btn-logout">
            <span class="icon-logout"></span>
            <span>Logout</span>
        </button>
    </div>

    <!-- lapis 2 -->
    <div class="welcome">
        <!-- bagian kiri -->
        <section class="acc-card">
            <span class="profile"></span>
            <h3>Admin Saung</h3>
            <p>admin@saung.com</p>
        </section>

        <!-- bagian kanan -->
        <section class="welcome-content">
            <!-- sambutan -->
            <div class="sub-header">
                <div class="teks">
                    <h1 class="salam">Manajemen Menu</h1>
                    <p class="sub-salam">Kelola daftar hidangan, harga, dan ketersediaan stok menu restoran.</p>
                </div>
                <div class="adding">
                    <button class="add-btn" id="openMenuModal" type="button">+ Tambah Menu</button>
                </div>
            </div>
            

            <!-- search bar -->
            <div class="search-bar">
                <span class="icon-search"></span>
                <input type="search" id="menuSearch" placeholder="Cari nama makanan...">
                <button class="clear" type="button" aria-label="Hapus pencarian" hidden>×</button>
            </div>

            <!-- filtering category button -->
            <div class="category-filter">
                <button class="filter-active" data-category="semua">Semua</button>
                <button class="filter-btn" data-category="makanan">Makanan</button>
                <button class="filter-btn" data-category="minuman">Minuman</button>
                <button class="filter-btn" data-category="camilan">Camilan</button>
                <button class="filter-btn" data-category="sambal">Sambal</button>
            </div>
        </section>
    </div>

    <!-- lapis 3 -->
    <div class="lapis3">
        <div class="tab-bar">
            <button class="tab">
                <a href="dashboard.html">
                    <span class="dashboard"></span>
                    <span>Dashboard</span>
                </a>
            </button>

            <button class="tab-active">
                <a href="menu.html">
                    <span class="icon-menu"></span>
                    <span>Menu</span>
                </a>
            </button>

            <button class="tab">
                <a href="akun.html">
                    <span class="akun"></span>
                    <span>Akun</span>
                </a>
            </button>

            <button class="tab">
                <a href="laporan.html">
                    <span class="laporan"></span>
                    <span>Laporan Transaksi</span>
                </a>
            </button>
        </div>

        <div class="main-content">
            <section class="content1">
                <h3>Penjualan 7 Hari Terakhir</h3>
            </section>
            <section class="content2">
                <div class="menu-terlaris">
                    <h3>Top 5 Menu Terlaris</h3>
                </div>
                <div class="transaksi">
                    <h3>Transaksi Terakhir</h3>
                </div>
            </section>
        </div>
    </div>

    <!-- popup modal tambah menu -->
    <div class="popup-modal" id="menuModal" aria-hidden="true">
        <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button class="modal-close js-close-modal" type="button" aria-label="Tutup">
                &times;
            </button>

            <h2 id="modalTitle">Tambah Menu</h2>
            <p>Lengkapi detail hidangan baru dibawah ini.</p>
            <hr>

            <form id="formTambahMenu">
                <label>
                    Nama Menu
                    <input name="menuName" type="text" placeholder="Contoh: Nasi Liwet" required>
                </label>

                <label>
                    Kategori
                    <select name="menuCategory" required>
                        <option value="" disabled selected hidden>Pilih kategori</option>
                        <option value="makanan">Makanan</option>
                        <option value="minuman">Minuman</option>
                        <option value="camilan">Camilan</option>
                        <option value="sambal">Sambal</option>
                    </select>
                </label>

                <div class="group-price">
                    <label for="menuPrice">Harga</label>
                    <div class="price-setting">
                        <span class="rupiah">Rp</span>
                        <input id="menuPrice" name="menuPrice" type="text" inputmode="numeric" placeholder="25.000" required>
                    </div>
                </div>

                <label>
                    Deskripsi
                    <textarea name="menuDescription" rows="3" placeholder="Deskripsi singkat menu"></textarea>
                </label>

                <label>
                    Foto Menu
                    <input name="menuImage" type="file" accept="image/*" required>
                </label>

                <label class="pedas-setting" name="hasSpiceLevel" id="hasSpiceLevel">
                    <input type="checkbox">
                    <span class="check-pedas">Tersedia pilihan level pedas</span>
                </label>

                <div class="modal-actions">
                    <button class="batal-btn js-close-modal" type="button">Batal</button>
                    <button class="simpan-btn" type="submit">Simpan Menu</button>
                </div>
            </form>
        </section>
    </div>
    <script src="../../js/admin.js"></script>
</body>
</html>

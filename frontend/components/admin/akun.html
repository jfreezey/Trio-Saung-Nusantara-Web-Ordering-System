<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Trio Saung Nusantara</title>

    <link rel="stylesheet" href="/frontend/css/variable.css">
    <link rel="stylesheet" href="/frontend/css/Admin/admin.css">
    <link rel="stylesheet" href="/frontend/css/Admin/menu.css">
    <link rel="stylesheet" href="/frontend/css/Admin/akun.css">
</head>
<body>
    <!-- header logo & nama resto & logout -->
    <div class="header">
        <button class="burger-menu" id="burgerToggle" aria-label="Toggle Sidebar">
            <span class="burger"></span>
        </button>
        
        <div class="logo">
            <img src="../../assets/images/logo/bulat.png" alt="logo Trio Saung Nusantara" class="logo">
        </div>

        <div class="title">
            <h1>Trio Saung Nusantara</h1>
        </div>
        
        <button class="btn-logout">
            <span class="icon-logout"></span>
            <span>Logout</span>
        </button>
    </div>

    <!-- lapis 2 -->
    <div class="welcome">
        <!-- bagian kiri -->
        <div class="kiri">
            <section class="acc-card">
                <span class="profile"></span>
                <h3>Admin Saung</h3>
                <p>admin@saung.com</p>
            </section>

            <div class="tab-bar">
                <button class="tab">
                    <a href="dashboard.html">
                        <span class="dashboard"></span>
                        <span>Dashboard</span>
                    </a>
                </button>

                <button class="tab">
                    <a href="menu.html">
                        <span class="icon-menu"></span>
                        <span>Menu</span>
                    </a>
                </button>

                <button class="tab-active">
                    <a href="akun.html">
                        <span class="akun"></span>
                        <span>Akun</span>
                    </a>
                </button>

                <button class="tab">
                    <a href="laporan.html">
                        <span class="laporan"></span>
                        <span>Laporan Penjualan</span>
                    </a>
                </button>
            </div>
        </div>
        
        <section class="welcome-content">
            <!-- sambutan -->
            <div class="sub-header">
                <div class="teks">
                    <h1 class="salam">Daftar Akun Admin & Kasir</h1>
                    <p class="sub-salam">Informasi akun terdaftar beserta peran dan status aktif operasional restoran.</p>
                </div>
            </div>

            <!-- tabel akun -->
            <div class="main-content">
                <div class="tabel-menu">
                    <table class="daftar-menu">
                        <!-- heading tabel -->
                        <thead>
                            <tr>
                                <th class="nama-kolom">Email</th>
                                <th class="nama-kolom">Peran (Role)</th>
                                <th class="nama-kolom">Status</th>
                            </tr>
                        </thead>
                        <!-- isi daftar menu -->
                        <tbody id="isi-tabel-akun">
                            <!-- isi melalui js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>        
    </div>

    <script src="/frontend/js/Admin/admin.js"></script>
    <script src="/frontend/js/Admin/akun.js"></script>
</body>
</html>

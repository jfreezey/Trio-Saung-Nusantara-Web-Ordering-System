<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Menu - Trio Saung Nusantara</title>

    <link rel="stylesheet" href="/frontend/css/variable.css">
    <link rel="stylesheet" href="/frontend/css/Customer/pelanggan.css">
    <link rel="stylesheet" href="/frontend/css/Customer/menu-detail.css">
</head>
<body>
    <main class="detail-page" id="detail-container" data-menu-id="">
        <!-- arrow back -->
        <section class="detail-hero">
            <a href="main.html" class="detail-back-btn" id="detail-back-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </a>

            <div class="detail-carousel" id="detail-carousel">
                <!-- gambar dari database -->
                <img id="detail-img" src="" alt="Foto Menu" hidden>
            </div>

            <!-- slide foto -->
            <div class="carousel-dots" id="carousel-dots" aria-hidden="true">
                <span class="dot active"></span>
                <span class="dot"></span>
            </div>
        </section>

        <!-- background putih -->
        <section class="detail-sheet">
            <div class="detail-sheet-inner">
                <h1 class="detail-title" id="detail-title">Nasi Goreng Kecombrang</h1>
                <p class="detail-price" id="detail-price">Rp 45.000</p>
                <p class="detail-desc" id="detail-desc">
                    Dimasak dengan sambal kecombrang khas buatan Trio Saung Nusantara.
                </p>

                <!-- admin tick level kepedasan -->
                <div class="detail-option-group" id="spicy-level-group">
                    <h2 class="option-label">Level Pedas</h2>
                    <div class="spicy-pills" role="radiogroup">
                        <button type="button" class="spicy-pill" data-level="Tidak Pedas" aria-checked="false">
                            Tidak Pedas
                        </button>
                        <button type="button" class="spicy-pill" data-level="Sedang" aria-checked="false">
                            Sedang
                        </button>
                        <button type="button" class="spicy-pill" data-level="Pedas" aria-checked="false">
                            Pedas
                        </button>
                    </div>
                </div>

                <!-- bagian pesan / catatan -->
                <div class="detail-note-section">
                    <div class="note-label-row">
                        <label for="order-note" class="option-label">Pesan:</label>
                        <span class="optional-badge">Opsional</span>
                    </div>
                    <textarea 
                        id="order-note" 
                        class="note-textarea" 
                        rows="4" 
                        maxlength="150"
                        placeholder="Tambahkan catatan disini."></textarea>
                </div>

                <!-- button stepper (tambah / kurang menu)-->
                <div class="detail-stepper-wrap">
                    <button type="button" class="qty-box-btn btn-minus" id="qty-minus">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
                    </button>

                    <span class="qty-display" id="qty-display">1</span>

                    <button type="button" class="qty-box-btn btn-plus" id="qty-plus">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- tombol tambah ke keranjang -->
    <div class="detail-action-dock">
        <button type="button" class="add-to-cart-btn" id="add-to-cart-btn" disabled>
            <span>Tambah ke Keranjang</span>
            <strong id="btn-subtotal">Rp 0</strong>
        </button>
    </div>

    <script src="/frontend/js/Customer/menu-detail.js"></script>
</body>
</html>
